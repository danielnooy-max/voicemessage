<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

.voice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 280px;
  padding: 12px 16px;
  background: #ff8fb3;
  border-radius: 22px;
  color: white;
  box-sizing: border-box;
}

.play {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: white;
  color: #ff6f9c;
  font-size: 16px;
  cursor: pointer;
}

.waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 30px;
  flex: 1;
}

.bar {
  width: 3px;
  background: white;
  border-radius: 3px;
}

.time {
  font-size: 12px;
  white-space: nowrap;
}
</style>
</head>

<body>

<div class="voice">
  <button class="play" onclick="toggleAudio()">▶</button>

  <div class="waveform">
    <div class="bar" style="height:10px"></div>
    <div class="bar" style="height:20px"></div>
    <div class="bar" style="height:15px"></div>
    <div class="bar" style="height:27px"></div>
    <div class="bar" style="height:18px"></div>
    <div class="bar" style="height:24px"></div>
    <div class="bar" style="height:12px"></div>
    <div class="bar" style="height:26px"></div>
    <div class="bar" style="height:17px"></div>
    <div class="bar" style="height:22px"></div>
  </div>

  <span class="time">0:18</span>
</div>

<audio id="audio"
src="https://drive.google.com/uc?export=download&id=d/1c600zLP3S6Ul9wRaUIbJ5C3rM96MSxx5">
</audio>

<script>
const audio = document.getElementById("audio");
const button = document.querySelector(".play");

function toggleAudio() {
  if (audio.paused) {
    audio.play();
    button.textContent = "❚❚";
  } else {
    audio.pause();
    button.textContent = "▶";
  }
}

audio.onended = function() {
  button.textContent = "▶";
};
</script>

</body>
</html>
